<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Holomorphic-VIS: Модульный движок</title>
  <style>
    body {
      background-color: #020617; color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex; flex-direction: column; align-items: center;
      margin: 0; padding: 15px; user-select: none;
    }
    h1 { font-size: 1.25rem; margin-bottom: 8px; font-weight: 500; }
    .tabs { display: flex; gap: 10px; margin-bottom: 10px; }
    button {
      background: #0f172a; color: #94a3b8; border: 1px solid #1e293b;
      padding: 7px 14px; border-radius: 8px; font-family: monospace; cursor: pointer;
      font-size: 0.85rem; transition: all 0.2s;
    }
    button.active, button:hover {
      background: #1e293b; color: #38bdf8; border-color: #38bdf8;
    }
    .viewport {
      position: relative; width: 820px; height: 620px;
      border: 1px solid #1e293b; border-radius: 12px; overflow: hidden;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.7); cursor: grab;
      background: #0f172a;
    }
    .viewport:active { cursor: grabbing; }
    canvas, svg { position: absolute; top: 0; left: 0; width: 820px; height: 620px; }
    svg { pointer-events: none; }
    .hud {
      margin-top: 10px; font-family: monospace; font-size: 0.85rem;
      background: #0f172a; padding: 9px 16px; border-radius: 8px; border: 1px solid #1e293b;
    }
    span { color: #38bdf8; }
    .warn { color: #f43f5e; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Голоморфный движок: D-WebAssembly + WebGL GPU</h1>
  
  <div class="tabs">
    <button class="active" data-mode="candles">1. Биржевые свечи + HBI</button>
    <button data-mode="splines">2. Конформные сплайны</button>
    <button data-mode="newton">3. Бассейны Ньютона (GPU)</button>
    <button data-mode="stress">4. Гистограмма + 5 000 частиц</button>
  </div>

  <div class="viewport" id="viewport">
    <canvas id="gl-canvas" width="820" height="620" style="display:none;"></canvas>
    <canvas id="batch-canvas" width="820" height="620" style="display:none;"></canvas>
    <svg id="vector-layer" width="820" height="620" viewBox="0 0 820 620"></svg>
  </div>

  <div class="hud" id="hud">Инициализация D-Wasm и GPU...</div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
